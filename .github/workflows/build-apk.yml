name: Build vibe<3 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --project-name vibe3 --org com.vibe --platforms android .

      - name: Set Android SDK versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 35")
          s = s.replace("compileSdk flutter.compileSdkVersion", "compileSdk 35")
          s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
          s = s.replace("minSdk flutter.minSdkVersion", "minSdk 23")
          p.write_text(s)
          PY

      - name: Set Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 35")
          s = s.replace("compileSdk flutter.compileSdkVersion", "compileSdk 35")
          p.write_text(s)
          PY

      - name: Set launcher name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:label="vibe3"', 'android:label="Vibe&lt;3"')
          p.write_text(s)
          PY

      - name: Enable internet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          additions = []
          if "android.permission.INTERNET" not in s:
              additions.append('    <uses-permission android:name="android.permission.INTERNET" />')
          if "android.permission.RECORD_AUDIO" not in s:
              additions.append('    <uses-permission android:name="android.permission.RECORD_AUDIO" />')
          if additions:
              s = s.replace(marker, marker + "\n" + "\n".join(additions), 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vibe3-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
