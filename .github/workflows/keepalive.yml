# Keepalive: Render free засыпает после 15 мин простоя — пингуем /health каждые 5 минут,
# чтобы «чаты не грузит» при холодном старте больше не случалось.
name: keepalive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: keepalive
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/h.json -w '%{http_code}' -m 90 https://vibe3-api.onrender.com/health || echo 000)
            echo "attempt $i -> HTTP $code $(cat /tmp/h.json 2>/dev/null || true)"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::warning::health not 200 after 3 attempts"
